server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text, JS, CSS, JSON and SVG.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # connect-src * is deliberate: the app calls Supabase and arbitrary addon hosts.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Server-level security headers; inherited by locations that have no add_header of their own.
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    add_header X-Frame-Options "DENY";
    add_header Content-Security-Policy $csp;

    # Health check.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Runtime config generated by the entrypoint. The html dir is read-only for the
    # non-root user, so the generated file lives in /tmp. Must come before location /.
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
        add_header Content-Security-Policy $csp;
    }

    # Long cache for hashed build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
        add_header Content-Security-Policy $csp;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
        add_header Content-Security-Policy $csp;
    }
}
